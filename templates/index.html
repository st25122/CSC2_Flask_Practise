<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Flask Website</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <nav>
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('about') }}">About Me</a>
            <a href="{{ url_for('invoice') }}">Checkout</a>
        </nav>
    </header>

    <main>
        <h1>Welcome to My Flask Website</h1>
        <p>Use the links above to visit the about me page or checkout page.</p>

        <section>
            <h2>Flowers</h2>

            {% for flower in flowers %}
                <article class="flower-card">
                    <h3>{{ flower.name }}</h3>
                    <p><strong>Price:</strong> ${{ flower.price }}</p>
                    <p><strong>In stock:</strong> {{ flower.stock }}</p>
                </article>
            {% endfor %}
        </section>
    </main>
</body>
</html>
