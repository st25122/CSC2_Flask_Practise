<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Flask Website</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <nav>
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('about') }}">About Me</a>
            <a href="{{ url_for('invoice') }}">Checkout</a>
        </nav>
    </header>

    <main>
        <h1>Checkout</h1>

        <section class="invoice">
            <h2>Invoice</h2>
            <p><strong>Customer:</strong> Guest</p>
            <p><strong>Order Number:</strong> 1001</p>

            <table>
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Quantity</th>
                        <th>Price</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Example Product</td>
                        <td>1</td>
                        <td>$20.00</td>
                    </tr>
                    <tr>
                        <td>Shipping</td>
                        <td>1</td>
                        <td>$5.00</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <th colspan="2">Total</th>
                        <th>$25.00</th>
                    </tr>
                </tfoot>
            </table>

            <button type="button">Complete Checkout</button>
        </section>
    </main>
</body>
</html>
